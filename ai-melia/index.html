<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7fb">
  <meta name="description" content="Meet AI.melia, Amelia Zmuda's conversational AI counterpart.">
  <title>AI.melia — Amelia Zmuda</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: #f7f7fb; color: #34364a; font-family: Arial, Helvetica, sans-serif; }
    .topbar { height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; background: #f7f7fb; border-bottom: 1px solid rgba(75,79,120,.12); }
    .back { color: #4f5f9e; text-decoration: none; font-size: 13px; font-weight: 600; letter-spacing: .01em; }
    .back:hover { text-decoration: underline; text-underline-offset: 4px; }
    .label { color: #777b91; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
    main { height: calc(100dvh - 48px); min-height: 0; }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
    @media (max-width: 560px) { .topbar { height: 42px; padding: 0 14px; } main { height: calc(100dvh - 42px); } .label { font-size: 9px; } }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="back" href="/">← Back to Amelia's portfolio</a>
    <span class="label">An interactive AI experiment</span>
  </header>
  <main>
    <iframe
      src="https://chat-with-a-imelia-amelia-a0ee.vercel.app"
      title="AI.melia — Amelia's AI counterpart"
      allow="microphone; autoplay; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
  </main>
</body>
</html>
