name: Restore exact case-study textures
on:
  push:
    paths:
      - .github/workflows/prepare-case-study-textures.yml
permissions:
  contents: write
jobs:
  textures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract original texture assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, base64
          source = Path("Grandma's Stories - Case study - Amelia Zmuda (1).html").read_text(errors="replace")
          assets = Path("grandmas-stories/assets")
          keys = [
              "corduroy-512.webp", "floral-512.webp", "floral.webp",
              "knit-512.webp", "knit.webp", "leather-512.webp",
              "linen-512.webp", "shag-512.webp", "tweed-512.webp",
              "tweed.webp", "walnut-512.webp"
          ]
          for name in keys:
              key = "/app/textures/" + name
              pattern = r'"' + re.escape(key) + r'":"data:[^,]+;base64,([^"]+)"'
              match = re.search(pattern, source)
              if not match:
                  raise SystemExit("Missing original texture: " + key)
              (assets / name).write_bytes(base64.b64decode(match.group(1)))
          page = Path("grandmas-stories/index.html")
          html = page.read_text()
          for name in ["corduroy", "shag", "walnut", "tweed", "floral", "leather", "knit", "linen"]:
              pattern = r'(\.tx-' + name + r'\s*\{.*?--tex:\s*image-set\()url\("[^"]+"\)\s*1x,\s*url\("[^"]+"\)\s*2x'
              replacement = r'\1url("/grandmas-stories/assets/' + name + r'-512.webp") 1x, url("/grandmas-stories/assets/' + name + r'.webp") 2x'
              html, count = re.subn(pattern, replacement, html, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit("Could not update texture CSS for " + name)
          html = re.sub(
              r'(<div class="tex" style="background-image:url\()[^)]*(\)"></div><b>Grandma florals</b>)',
              r'\1/grandmas-stories/assets/floral.webp\2', html)
          html = re.sub(
              r'(<div class="tex" style="background-image:url\()[^)]*(\)"></div><b>Knit</b>)',
              r'\1/grandmas-stories/assets/knit.webp\2', html)
          html = re.sub(
              r'(<div class="tex" style="background-image:url\()[^)]*(\)"></div><b>Tweed</b>)',
              r'\1/grandmas-stories/assets/tweed.webp\2', html)
          page.write_text(html)
          print("Restored exact original fabric textures.")
          PY
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/prepare-grandma-case-study-textures.yml
          git add -A grandmas-stories .github/workflows/prepare-grandma-case-study-textures.yml
          git commit -m "Restore original textures in Grandma case study"
          git push